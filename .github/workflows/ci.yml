name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: make e0
      - name: Docker sandbox
        run: SLUICE_DOCKER_TEST=1 go test -run TestDockerSandbox ./internal/label/
